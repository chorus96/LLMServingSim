# -----------------------------------------------------------------------------
# HB-PNM module: stacked LPDDR5X, 128 GB, ~1.1 TB/s  (CXL-PNM [4] baseline)
# -----------------------------------------------------------------------------
# Models the High-Bandwidth PNM (HB-PNM) device that NELSSA (SK hynix, IEEE
# CAL 2025, "PNM Meets Sparse Attention") uses as its CXL-PNM [4] baseline:
# an LPDDR-based CXL-PNM platform (Park et al., HPCA 2024) doing FULL attention
# on stacked high-bandwidth memory. Its strength is bandwidth (~1.1 TB/s, ~5.5x
# the HC-PNM DDR5 module); its weakness is capacity (128 GB vs 1 TB), which
# causes OOM on multi-million-token sequences (the paper's Fig. 5 'X' markers).
#
# Per-channel bandwidth = bus_width/8 * data_rate/1000 = 128/8 * 8533/1000
#                       = 136.5 GB/s
# ch_capacity           = 16 GB  ->  128 GB module = 8 channels
# aggregate bandwidth   = 8 * 136.5 = 1092 GB/s  (~1.1 TB/s, matches paper)
# -----------------------------------------------------------------------------
[dram_structure]
protocol = LPDDR5
bankgroups = 8
banks_per_group = 4
rows = 32768
columns = 1024
device_width = 16
BL = 16
pim_type = SINGLE

[timing]
tCK = 0.2344       # ns (8533 MT/s stacked LPDDR5X)
AL = 0
CL = 40
CWL = 38
tRCD = 40
tRP = 40
tRAS = 136
tRFC = 1216
tRFC2 = 816
tRFC4 = 461
tREFI = 24960
tRPRE = 1
tWPRE = 1
tRRD_S = 12
tRRD_L = 12
tWTR_S = 16
tWTR_L = 32
tFAW = 48
tWR = 34
tWR2 = 36
tRTP = 12
tCCD_S = 4
tCCD_L = 8
tCKE = 6
tCKESR = 7
tXS = 1230
tXP = 6
tRTRS = 1

[power]
VDD = 1.05
IDD0 = 110
IPP0 = 4.5
IDD2P = 32
IDD2N = 42
IDD3P = 50
IDD3N = 58
IDD4W = 320
IDD4R = 340
IDD5AB = 360
IDD6x = 38

[system]
channel_size = 16384    # unit: MB (16 GB per channel)
channels = 1
bus_width = 128
address_mapping = rochrababgco
queue_structure = PER_BANK
refresh_policy = RANK_LEVEL_STAGGERED
row_buf_policy = OPEN_PAGE
cmd_queue_size = 256
trans_queue_size = 64

[other]
epoch_period = 1204819
output_level = 1
data_rate = 8533 # MT/s
idle_power = 900 # mW
peak_power = 5200 # mW
# High-bandwidth stacked memory: the same bandwidth-saturating compute premise
# (OI ~ 8) gives a much larger absolute compute budget at 1.1 TB/s.
operational_intensity = 8
