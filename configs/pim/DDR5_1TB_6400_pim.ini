# -----------------------------------------------------------------------------
# NELSSA HC-PNM module: 4-CH DDR5-6400, 1 TB, ~200 GB/s
# -----------------------------------------------------------------------------
# Models the High-Capacity PNM (HC-PNM) module from NELSSA (SK hynix,
# IEEE CAL 2025, "PNM Meets Sparse Attention"). Each PNM module pairs a
# high-capacity DDR5 array with a lightweight compute engine sized just to
# saturate the module's internal bandwidth (compute is not the limiter), so
# the attention latency is modeled as bandwidth-bound streaming of the KV
# cache (see pim_model.estimate_with_linear coefficients for this spec).
#
# Per-channel bandwidth = bus_width/8 * data_rate/1000 = 64/8 * 6400/1000
#                       = 51.2 GB/s
# ch_capacity           = 256 GB  ->  1 TB module = 4 channels
# aggregate bandwidth   = 4 * 51.2 = 204.8 GB/s  (~200 GB/s, matches paper)
# -----------------------------------------------------------------------------
[dram_structure]
protocol = DDR5
bankgroups = 8
banks_per_group = 4
rows = 65536
columns = 1024
device_width = 8
BL = 16
pim_type = SINGLE

[timing]
tCK = 0.3125        # ns (6400 MT/s = 3200 MHz CK)
AL = 0
CL = 40            # RL @6400 MT/s
CWL = 38
tRCD = 40
tRP = 40
tRAS = 104         # ~32 ns / 0.3125
tRFC = 944         # ~295 ns / 0.3125 (16 Gb)
tRFC2 = 640
tRFC4 = 416
tREFI = 12480      # 3.9 us / 0.3125
tRPRE = 1
tWPRE = 1
tRRD_S = 8
tRRD_L = 12
tWTR_S = 12
tWTR_L = 32
tFAW = 40
tWR = 96
tWR2 = 100
tRTP = 24
tCCD_S = 8
tCCD_L = 16
tCKE = 8
tCKESR = 9
tXS = 960
tXP = 24
tRTRS = 1

[power]
VDD = 1.1
IDD0 = 90
IPP0 = 4.0
IDD2P = 28
IDD2N = 40
IDD3P = 48
IDD3N = 58
IDD4W = 300
IDD4R = 320
IDD5AB = 300
IDD6x = 32

[system]
channel_size = 262144   # unit: MB (256 GB per channel)
channels = 1
bus_width = 64
address_mapping = rochrababgco
queue_structure = PER_BANK
refresh_policy = RANK_LEVEL_STAGGERED
row_buf_policy = OPEN_PAGE
cmd_queue_size = 128
trans_queue_size = 32

[other]
epoch_period = 1587301
output_level = 1
data_rate = 6400 # MT/s
idle_power = 800 # mW
peak_power = 4200 # mW
